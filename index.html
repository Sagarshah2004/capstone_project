<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Money Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <div class="container">
    <h1>💸 Money Manager</h1>

    <div class="summary">
      <div class="card income">
        <h3>Income</h3>
        <p>₹<span id="income">0</span></p>
      </div>
      <div class="card expense">
        <h3>Expense</h3>
        <p>₹<span id="expense">0</span></p>
      </div>
      <div class="card balance">
        <h3>Balance</h3>
        <p>₹<span id="balance">0</span></p>
      </div>
    </div>

    <button class="add-btn" onclick="openForm()">+ Add Transaction</button>
    <button class="summary-btn" onclick="toggleChart()">📊 Show Summary</button>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

    <div id="chartBox" class="chart-container" style="display: none;">
      <canvas id="financeChart"></canvas>
    </div>

  </div>

  <div id="popup" class="popup">
    <form id="transactionForm" class="form">
      <h2>Add Transaction</h2>

      <input type="number" id="amount" placeholder="Amount" required>
      <input type="date" id="date" required>

      <div class="radio-group">
        <label><input type="radio" name="type" value="Income"> Income</label>
        <label><input type="radio" name="type" value="Expense"> Expense</label>
      </div>

      <select id="subcategory" required>
        <option value="">Select Category</option>
      </select>

      <input type="text" id="desc" placeholder="Description">

      <div class="form-buttons">
        <button type="submit" class="save">Save</button>
        <button type="button" class="cancel" onclick="closeForm()">Cancel</button>
      </div>
    </form>
  </div>

  <footer class="footer">
    <p>© 2026 Money Manager App | Sagar Kumar Sha</p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>

</body>
</html>
